<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="RocksteadyBot — AI teammates you actually own">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2965EC" />
      <stop offset="1" stop-color="#5C89F8" />
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- ground -->
  <rect width="1280" height="640" fill="#f4efe6" />
  <rect x="16" y="16" width="1248" height="608" rx="28" fill="#fffdf8" stroke="#e4dccb" />

  <!-- brand lockup -->
  <g transform="translate(72,58)">
    <rect width="46" height="46" rx="14" fill="url(#mark)" />
    <rect x="13.5" y="12" width="6.5" height="22" rx="3.25" fill="#F2F2F0" />
    <rect x="26" y="12" width="6.5" height="22" rx="3.25" fill="#F2F2F0" />
    <text x="62" y="31" font-size="27" font-weight="600" fill="#2c2118">RocksteadyBot</text>
  </g>

  <!-- badge row -->
  <g transform="translate(72,122)">
    <rect width="86" height="30" rx="15" fill="#f4efe6" stroke="#e4dccb" />
    <text x="43" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#d97757" letter-spacing="0.05em">APACHE-2.0</text>
    <text x="102" y="20" font-size="14" fill="#5c4e3e">Open-source AI teammates — run them on your own machine</text>
  </g>

  <!-- headline -->
  <text x="640" y="244" text-anchor="middle" font-size="64" font-weight="800" fill="#2c2118" letter-spacing="-0.02em">AI teammates you actually own</text>
  <text x="640" y="292" text-anchor="middle" font-size="20" fill="#5c4e3e">Give a bot real work. It signs in to your tools, uses them the way you do,</text>
  <text x="640" y="320" text-anchor="middle" font-size="20" fill="#5c4e3e">and comes back when it needs you. Your keys, your model, your machine.</text>

  <!-- abstract three-pane app hint: list · chat · computer -->
  <g transform="translate(72,368)">
    <rect width="1136" height="216" rx="18" fill="#f4efe6" stroke="#e4dccb" />

    <!-- left: teammate list -->
    <rect x="22" y="22" width="292" height="172" rx="12" fill="#fffdf8" stroke="#e4dccb" />
    <rect x="40" y="42" width="150" height="9" rx="4.5" fill="#c4b498" />
    <g fill="#ebe4d6">
      <rect x="40" y="70" width="256" height="26" rx="7" />
      <rect x="40" y="104" width="256" height="26" rx="7" fill="#e4d9c4" />
      <rect x="40" y="138" width="256" height="26" rx="7" />
    </g>
    <g fill="#5C89F8">
      <circle cx="53" cy="83" r="6" />
      <circle cx="53" cy="117" r="6" fill="#3EC5A8" />
      <circle cx="53" cy="151" r="6" fill="#d97757" />
    </g>

    <!-- center: conversation -->
    <rect x="330" y="22" width="470" height="172" rx="12" fill="#fffdf8" stroke="#e4dccb" />
    <rect x="352" y="44" width="130" height="9" rx="4.5" fill="#c4b498" />
    <rect x="352" y="72" width="300" height="20" rx="10" fill="#ebe4d6" />
    <rect x="352" y="100" width="380" height="20" rx="10" fill="#ebe4d6" />
    <rect x="520" y="140" width="258" height="34" rx="12" fill="#3a2e24" />

    <!-- right: the bot's computer -->
    <rect x="816" y="22" width="298" height="172" rx="12" fill="#2c2118" />
    <rect x="836" y="42" width="120" height="8" rx="4" fill="#6a5a48" />
    <g fill="#5c4e3e">
      <rect x="836" y="70" width="230" height="8" rx="4" />
      <rect x="836" y="90" width="196" height="8" rx="4" />
      <rect x="836" y="110" width="244" height="8" rx="4" />
      <rect x="836" y="130" width="170" height="8" rx="4" />
    </g>
    <rect x="836" y="156" width="90" height="20" rx="10" fill="#d97757" />
  </g>
</svg>
